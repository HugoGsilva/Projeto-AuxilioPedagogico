name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores fictícios apenas para typecheck/build em CI — nunca usados em runtime
  SKIP_ENV_VALIDATION: "true"
  VITE_SERVER_URL: http://localhost:3000
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-placeholder-secret-with-32-chars!!
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:3001

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build

  docker:
    name: docker-hub
    needs: ci
    # PRs de fork não recebem secrets; o restante (PR interno, push na main, dispatch) publica.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Defina DOCKERHUB_USERNAME e DOCKERHUB_TOKEN em Settings → Secrets and variables → Actions (repositório, não Environment)."
            exit 1
          fi

      - name: Normalizar namespace Docker Hub
        id: hub
        run: echo "owner=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta_web
        with:
          images: ${{ steps.hub.outputs.owner }}/auxilio-pedagogico-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,prefix=sha-

      - uses: docker/metadata-action@v5
        id: meta_server
        with:
          images: ${{ steps.hub.outputs.owner }}/auxilio-pedagogico-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build e push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=auxilio-pedagogico
          cache-to: type=gha,mode=max,scope=auxilio-pedagogico

      - name: Build e push server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha,scope=auxilio-pedagogico
          cache-to: type=gha,mode=max,scope=auxilio-pedagogico
