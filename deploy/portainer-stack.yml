version: "3.8"

# Ambiente de TESTE — valores fixos de propósito (não usar na escola em produção).
# Portainer: cole este arquivo e faça o deploy. Sem variáveis extras.
# Login: diretor@escola.local / Dev@12345
# (também ti@, pedagoga@, professora@escola.local — mesma senha)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auxilio_pedagogico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AuxilioTest2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auxilio_pedagogico"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  api:
    image: hugogsilva/auxilio-pedagogico-server:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://postgres:AuxilioTest2026@postgres:5432/auxilio_pedagogico
      BETTER_AUTH_SECRET: auxilio-pedagogico-teste-secret-32b
      BETTER_AUTH_URL: https://extensao.hugogsilva.dev
      CORS_ORIGIN: https://extensao.hugogsilva.dev
      ALLOW_SEED: "true"
      SEED_PASSWORD: Dev@12345
      GOTENBERG_URL: http://gotenberg:3000
      # Conta "mãe" de diretora no 1º deploy real (opcional; idempotente — não
      # altera conta existente). Preencher e descomentar; o script recusa
      # placeholders TROCAR_* e senha com menos de 8 caracteres.
      # BOOTSTRAP_DIRECTOR_EMAIL: diretora@escola.exemplo.br
      # BOOTSTRAP_DIRECTOR_NAME: Nome da Diretora
      # BOOTSTRAP_DIRECTOR_PASSWORD: TROCAR_SENHA_FORTE
    networks:
      - internal
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "1"
          memory: 1G
      labels:
        - traefik.enable=true
        - traefik.http.routers.auxilio-api.rule=Host(`extensao.hugogsilva.dev`) && (PathPrefix(`/trpc`) || PathPrefix(`/api/auth`))
        - traefik.http.routers.auxilio-api.entrypoints=websecure
        - traefik.http.routers.auxilio-api.priority=10
        - traefik.http.routers.auxilio-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.auxilio-api.service=auxilio-api
        - traefik.http.services.auxilio-api.loadbalancer.server.port=3000

  # Conversor HTML→PDF (ADR-0005). Só na rede interna: sem Traefik, sem porta
  # pública — apenas a API alcança o serviço.
  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=30s"]
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "1"
          memory: 768M

  # Backup diário criptografado enviado para object storage fora do VPS
  # (ADR-0006). Sem porta pública — só cliente do Postgres na rede interna.
  # Antes do deploy real: preencher os TROCAR_* (o serviço se recusa a subir
  # com placeholder) e ver docs/backup.md.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: auxilio_pedagogico
      PGUSER: postgres
      PGPASSWORD: AuxilioTest2026
      BACKUP_HOUR_UTC: "06" # ~03:00 no horário de Brasília
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_PASSPHRASE: TROCAR_PASSPHRASE_FORTE
      BACKUP_REMOTE_PATH: "remote:TROCAR_BUCKET/auxilio-pedagogico"
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: Cloudflare
      RCLONE_CONFIG_REMOTE_ENDPOINT: TROCAR_ENDPOINT_S3
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: TROCAR_ACCESS_KEY_ID
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: TROCAR_SECRET_ACCESS_KEY
      RCLONE_CONFIG_REMOTE_REGION: auto
    volumes:
      - backup_state:/state
    networks:
      - internal
    healthcheck:
      # Unhealthy se o último sucesso tiver mais de 36h — visível no Portainer.
      test:
        [
          "CMD-SHELL",
          "test -f /state/last-success && [ $$(( $$(date -u +%s) - $$(cat /state/last-success) )) -lt 129600 ]",
        ]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 26h
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    command:
      - sh
      - -c
      - |
        set -u
        log() { echo "[backup] $$(date -u +%Y-%m-%dT%H:%M:%SZ) $$1"; }
        for v in "$$BACKUP_PASSPHRASE" "$$BACKUP_REMOTE_PATH" "$$RCLONE_CONFIG_REMOTE_ENDPOINT" "$$RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID" "$$RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY"; do
          case "$$v" in *TROCAR_*|"") log "ERRO: configuracao de backup incompleta (placeholder TROCAR_* pendente)"; exit 1;; esac
        done
        apk add --no-cache openssl rclone >/dev/null 2>&1 || { log "ERRO: apk add falhou"; exit 1; }
        mkdir -p /state
        backup_once() {
          ts="$$(date -u +%Y%m%d-%H%M%S)"
          name="auxilio_pedagogico_$${ts}.dump.enc"
          tmp="/tmp/$${name}"
          if ! pg_dump -Fc -f /tmp/db.dump "$$PGDATABASE"; then
            log "FALHA: pg_dump"; rm -f /tmp/db.dump; return 1
          fi
          if ! [ -s /tmp/db.dump ]; then
            log "FALHA: dump vazio"; rm -f /tmp/db.dump; return 1
          fi
          if ! openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:BACKUP_PASSPHRASE -in /tmp/db.dump -out "$${tmp}.part"; then
            log "FALHA: criptografia"; rm -f /tmp/db.dump "$${tmp}.part"; return 1
          fi
          if ! mv "$${tmp}.part" "$$tmp"; then
            log "FALHA: mv do arquivo criptografado"; rm -f /tmp/db.dump "$${tmp}.part"; return 1
          fi
          rm -f /tmp/db.dump
          if ! rclone copyto "$$tmp" "$$BACKUP_REMOTE_PATH/$$name" --checksum; then
            log "FALHA: upload"; rm -f "$$tmp"; return 1
          fi
          rm -f "$$tmp"
          rclone delete "$$BACKUP_REMOTE_PATH" --min-age "$${BACKUP_RETENTION_DAYS}d" || log "AVISO: limpeza de retencao falhou"
          date -u +%s > /state/last-success
          log "SUCESSO $$name"
        }
        log "job iniciado; alvo diario $${BACKUP_HOUR_UTC}:00 UTC"
        last_run_date=""
        if [ -f /state/last-run-date ]; then last_run_date="$$(cat /state/last-run-date)"; fi
        while true; do
          today="$$(date -u +%Y-%m-%d)"
          hour="$$(date -u +%H)"
          if [ "$$hour" -ge "$$BACKUP_HOUR_UTC" ] && [ "$$today" != "$$last_run_date" ]; then
            if backup_once; then
              last_run_date="$$today"
              echo "$$today" > /state/last-run-date
            else
              log "tentativa falhou; proxima em ~30min"
              sleep 1500
            fi
          fi
          sleep 300
        done

  web:
    image: hugogsilva/auxilio-pedagogico-web:latest
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.auxilio-web.rule=Host(`extensao.hugogsilva.dev`)
        - traefik.http.routers.auxilio-web.entrypoints=websecure
        - traefik.http.routers.auxilio-web.priority=1
        - traefik.http.routers.auxilio-web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.auxilio-web.service=auxilio-web
        - traefik.http.services.auxilio-web.loadbalancer.server.port=80

networks:
  internal:
    driver: overlay
  network_swarm_public:
    external: true

volumes:
  postgres_data:
  backup_state:
