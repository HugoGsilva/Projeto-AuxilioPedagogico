server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers de segurança (aplicados a todas as respostas, inclusive o fallback
    # do SPA, via `always`). TLS é terminado pelo Traefik na frente; o HSTS
    # trafega para o cliente sobre HTTPS.
    add_header X-Frame-Options "DENY" always;                      # anti-clickjacking (navegadores antigos)
    add_header Content-Security-Policy "frame-ancestors 'none'" always;  # anti-clickjacking (navegadores modernos)
    add_header X-Content-Type-Options "nosniff" always;            # impede MIME sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
